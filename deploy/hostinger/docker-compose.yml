# MARHAS on Hostinger VPS — isolated Docker stack (PostgreSQL + API + Nginx)
# Does NOT bind host ports 80/443 (leaves the other site alone).
# Host nginx for marhas.pk proxies → 127.0.0.1:5080
#
# Usage (from /opt/marhas):
#   docker compose -p marhas -f deploy/hostinger/docker-compose.yml --env-file deploy/hostinger/.env up -d --build

name: marhas

services:
  db:
    image: postgres:16-alpine
    container_name: marhas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marhas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-marhas}
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
    volumes:
      - marhas_pgdata:/var/lib/postgresql/data
    networks:
      - marhas_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    cpus: 0.75
    # No host ports — Postgres is internal only

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: marhas-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-marhas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-marhas}?schema=public&connection_limit=10
    volumes:
      - marhas_uploads:/app/src/uploads
      - marhas_logs:/app/logs
    networks:
      - marhas_net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 60s
    mem_limit: 768m
    cpus: 1.0

  nginx:
    image: nginx:1.27-alpine
    container_name: marhas-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - marhas_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    cpus: 0.25

networks:
  marhas_net:
    name: marhas_net
    driver: bridge

volumes:
  marhas_pgdata:
    name: marhas_pgdata
  marhas_uploads:
    name: marhas_uploads
  marhas_logs:
    name: marhas_logs
