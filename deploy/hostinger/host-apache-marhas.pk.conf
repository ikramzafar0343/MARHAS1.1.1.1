# Host Apache vhost for marhas.pk ONLY
# Proxies to isolated Docker stack on 127.0.0.1:5080
# Does not change other VirtualHosts.

<VirtualHost *:80>
    ServerName marhas.pk
    ServerAlias www.marhas.pk

    ProxyPreserveHost On
    ProxyRequests Off
    AllowEncodedSlashes NoDecode

    ProxyPass / http://127.0.0.1:5080/
    ProxyPassReverse / http://127.0.0.1:5080/

    RequestHeader set X-Forwarded-Proto "http"
    ErrorLog ${APACHE_LOG_DIR}/marhas.pk-error.log
    CustomLog ${APACHE_LOG_DIR}/marhas.pk-access.log combined
</VirtualHost>
