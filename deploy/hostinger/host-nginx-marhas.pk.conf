# Host nginx site for marhas.pk ONLY
# Install on Hostinger VPS (does not modify other sites):
#   sudo cp host-nginx-marhas.pk.conf /etc/nginx/sites-available/marhas.pk
#   sudo ln -sf /etc/nginx/sites-available/marhas.pk /etc/nginx/sites-enabled/marhas.pk
#   sudo nginx -t && sudo systemctl reload nginx
#
# Proxies to the isolated Docker stack on 127.0.0.1:5080

server {
    listen 80;
    listen [::]:80;
    server_name marhas.pk www.marhas.pk;

    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
